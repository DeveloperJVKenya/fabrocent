name: fabrocent
description: "M-Pesa financial intelligence for Kenya — passive transaction tracking and spending insights."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.6.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_analytics: ^12.0.0
  firebase_crashlytics: ^5.0.0
  firebase_remote_config: ^6.0.0
  firebase_messaging: ^16.0.0
  firebase_app_check: ^0.4.5+2

  # State management
  flutter_riverpod: ^2.5.1

  # Local database
  path_provider: ^2.1.4

  # Charts
  fl_chart: ^0.69.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Security
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0

  # Permissions
  permission_handler: ^11.3.1

  # Navigation
  go_router: ^14.2.7

  # Firebase Storage
  firebase_storage: ^13.0.0

  # Utilities
  intl: ^0.20.0
  share_plus: ^10.0.3
  workmanager: ^0.6.0
  uuid: ^4.4.2
  crypto: ^3.0.5
  image_picker: ^1.1.2
  isar_community: ^3.4.1
  isar_community_flutter_libs: ^3.4.1
  firebase_ai: ^3.10.0

  cupertino_ui: any
  material_ui: any
  logger: ^2.5.0
  shared_preferences: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  flutter_launcher_icons: ^0.14.3
  isar_community_generator: ^3.4.1

flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: true
    image_path: "assets/images/logo.jpeg"
    background_color: "#1A5C31"
    theme_color: "#1A5C31"
  image_path: "assets/images/logo.jpeg"
  adaptive_icon_background: "#1A5C31"
  adaptive_icon_foreground: "assets/images/logo.jpeg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
